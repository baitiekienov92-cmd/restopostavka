{% extends "base.html" %}
{% block title %}Товары — админ{% endblock %}
{% block content %}

<div class="page-head">
  <h1>Товары</h1>
</div>

<div class="card" style="margin-bottom: 20px;">
  <h3 style="margin-top:0;">Добавить товар</h3>
  <form method="post" action="{{ url_for('admin_product_add') }}" style="display:flex; gap:10px; flex-wrap:wrap; align-items:end;">
    <div class="field" style="margin:0;">
      <label>Название</label>
      <input type="text" name="name" required>
    </div>
    <div class="field" style="margin:0;">
      <label>Ед. изм.</label>
      <input type="text" name="unit" value="кг" style="width:80px;">
    </div>
    <div class="field" style="margin:0;">
      <label>Цена, ₸</label>
      <input type="number" step="0.01" name="base_price" style="width:110px;">
    </div>
    <div class="field" style="margin:0;">
      <label>Категория</label>
      <select name="category_id" style="padding:10px; border:1px solid var(--line); border-radius:8px;">
        <option value="">—</option>
        {% for c in categories %}
        <option value="{{ c.id }}">{{ c.name }}</option>
        {% endfor %}
      </select>
    </div>
    <button class="btn" type="submit">Добавить</button>
  </form>
</div>

<div class="card">
  <table>
    <thead>
      <tr><th>Товар</th><th>Категория</th><th>Ед.</th><th>Цена и статус</th></tr>
    </thead>
    <tbody>
      {% for p in products %}
      <tr>
        <td>{{ p.name }}</td>
        <td>{{ p.category.name if p.category else '—' }}</td>
        <td class="mono">{{ p.unit }}</td>
        <td>
          <form method="post" action="{{ url_for('admin_product_update', product_id=p.id) }}" style="display:flex; gap:6px; align-items:center;">
            <input type="number" step="0.01" name="base_price" value="{{ p.base_price }}" style="width:90px; padding:6px; border:1px solid var(--line); border-radius:6px;" class="mono">
            <label style="display:flex; align-items:center; gap:4px; font-size:12px;">
              <input type="checkbox" name="is_active" {{ 'checked' if p.is_active }}> активен
            </label>
            <button class="btn small secondary" type="submit">Сохранить</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>

{% endblock %}
